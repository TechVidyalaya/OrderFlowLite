spring:
  datasource:
    url: jdbc:h2:mem:orderflow;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true
        default_batch_fetch_size: 0
    show-sql: true
  h2:
    console:
      enabled: true
logging:
  level:
    org.hibernate.SQL: DEBUG
